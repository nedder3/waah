name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Permisos mínimos para publicar en GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Cancela un deploy en curso si llega uno más nuevo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # CI: corre los tests en cada push/PR. Si están en rojo, el pipeline falla.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test

  # CD: publica el sitio estático en GitHub Pages (solo en push a master).
  # Requiere que Settings > Pages > Source esté en "GitHub Actions".
  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          # Sube el árbol respetando .gitignore (excluye node_modules, graphify-out).
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
